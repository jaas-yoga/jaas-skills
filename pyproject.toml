[project]
name = "jaas-registry"
version = "0.1.0"
description = "Stateless, GitOps-driven skill registry for AI-agent skill packages"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "semantic-version>=2.10",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "cryptography>=43.0",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "google-auth>=2.35",
    # google-auth's transport.requests (used by authn/google.py) imports this
    # directly but doesn't declare it as its own dependency.
    "requests>=2.32",
    # Client for the standalone jaas-guardrails service (guardrails/client.py)
    # — a real runtime dependency, not just test tooling, now that it's used
    # to call out over HTTP rather than executing guardrail checks in-process.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
jaasctl = "jaas_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaas_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
