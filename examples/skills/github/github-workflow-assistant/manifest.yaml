apiVersion: v1
id: jaas.devtools.github-assistant
name: GitHub Workflow Assistant
version: 1.3.0
description: >-
  Helps an AI agent follow a repo's git/GitHub conventions: drafting commit
  messages, opening pull requests and issues via the gh CLI, and reading CI
  status back before reporting success.
owner:
  team: jaas-registry-examples
  contact: examples@jaas-registry.local
entrypoint: SKILL.md
category: developer-tools
tags:
  - github
  - git
  - pull-requests
  - ci
  - developer-tools
runtime:
  - family: prompt
    versionRange: ">=1.0.0,<2.0.0"
