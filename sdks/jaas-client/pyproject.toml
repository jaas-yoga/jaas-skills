[project]
name = "jaas-client"
version = "0.1.0"
description = "Thin Python client for the JaaS skill registry REST API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # Real end-to-end tests against the actual registry API (TestClient),
    # not just mocked httpx -- a path dependency on the sibling backend
    # package, test-time only. Never a runtime dependency of this client:
    # jaas-registry is deliberately absent from [project.dependencies]
    # above, so installing jaas-client alone never pulls in FastAPI,
    # boto3, sigstore, etc.
    "jaas-registry",
]

[tool.uv.sources]
jaas-registry = { path = "../../", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaas_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
