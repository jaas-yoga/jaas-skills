[project]
name = "jaas-crewai"
version = "0.1.0"
description = "CrewAI tool adapter for the JaaS skill registry"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "jaas-client",
    "crewai-tools>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    # Real interop tests -- confirms the adapter's output is a real,
    # usable CrewAI tool, not just something shaped like one.
    "crewai>=0.7",
    "jaas-registry",
]

[tool.uv.sources]
jaas-client = { path = "../jaas-client", editable = true }
jaas-registry = { path = "../../", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaas_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
