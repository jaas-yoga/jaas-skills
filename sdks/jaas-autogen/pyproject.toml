[project]
name = "jaas-autogen"
version = "0.1.0"
description = "AutoGen tool adapter for the JaaS skill registry"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "jaas-client",
    # AutoGen's current (post-2024 rearchitecture) packages -- autogen-core
    # provides FunctionTool, the primitive an AutoGen agent's `tools` list
    # actually consumes; autogen-agentchat is the higher-level chat-agent
    # API most AutoGen users build against and is what the real-interop
    # test below exercises.
    "autogen-core>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "autogen-agentchat>=0.4",
    # ReplayChatCompletionClient -- a real, offline ChatCompletionClient
    # implementation for constructing a real AssistantAgent in tests
    # without calling any real LLM provider.
    "autogen-ext>=0.4",
    "jaas-registry",
]

[tool.uv.sources]
jaas-client = { path = "../jaas-client", editable = true }
jaas-registry = { path = "../../", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaas_autogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
