name: Publish Docker image

# Publishes on merge to main (not on PR approval like build-on-approval.yml
# — that workflow only verifies the package still builds; pushing to the
# registry from an approved-but-unmerged PR would let `latest` point at
# code that never actually lands on main). workflow_dispatch allows a
# manual re-publish of the current main without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jaasyoga/jaas-registry:latest
            jaasyoga/jaas-registry:${{ steps.sha.outputs.short }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Pulls whatever's newest for all three services (not just this
      # repo's), matching deploy/README.md's "docker compose pull && up -d"
      # — harmless for the two that didn't change, since compose only
      # recreates containers whose image actually differs.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # flock serializes this against the other two repos' identical
          # deploy jobs — all three can trigger around the same time
          # (independent merges within seconds of each other), and without
          # this, concurrent `docker compose up -d` runs on the same
          # project raced and corrupted container state in practice.
          #
          # .env is regenerated from repo secrets/variables on every deploy
          # — GitHub is the source of truth, not a hand-edited file on the
          # VM. The heredoc delimiter is quoted ('ENVEOF') so the remote
          # shell never re-interprets $ / backticks inside a secret value;
          # GitHub's own ${{ }} substitution already happened by the time
          # this script text reaches the runner.
          script: |
            cat > ${{ vars.DEPLOY_PATH }}/.env <<'ENVEOF'
            DOMAIN=${{ vars.DOMAIN }}
            API_DOMAIN=${{ vars.API_DOMAIN }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_GOOGLE_ID=${{ vars.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            JAAS_JWT_SECRET=${{ secrets.JAAS_JWT_SECRET }}
            JAAS_DEV_LOGIN_PASSWORD=${{ secrets.JAAS_DEV_LOGIN_PASSWORD }}
            ENVEOF
            cd ${{ vars.DEPLOY_PATH }}
            flock ~/.deploy.lock -c "docker compose pull && docker compose up -d"
