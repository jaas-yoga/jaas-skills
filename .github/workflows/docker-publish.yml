name: Publish Docker image

# Publishes on merge to main (not on PR approval like build-on-approval.yml
# — that workflow only verifies the package still builds; pushing to the
# registry from an approved-but-unmerged PR would let `latest` point at
# code that never actually lands on main). workflow_dispatch allows a
# manual re-publish of the current main without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jaasyoga/jaas-registry:latest
            jaasyoga/jaas-registry:${{ steps.sha.outputs.short }}
